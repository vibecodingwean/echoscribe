plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Load the optional release keystore configuration.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.echoscribe.app"

    // Android 16 / API 36 for current Google Play submissions.
    compileSdk 36

    defaultConfig {
        applicationId "com.echoscribe.app"
        manifestPlaceholders["appLabel"] = "Echo Scribe"
        // Flutter supplies these values so they stay aligned with pubspec.yaml.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystoreProperties["storeFile"]) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Build unsigned when no release keystore is configured locally.
            if (keystoreProperties["storeFile"]) {
                signingConfig signingConfigs.release
            }
            // Keep shrinking disabled until R8/ProGuard is intentionally enabled.
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // Install local test builds alongside the Play-signed production app.
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            manifestPlaceholders["appLabel"] = "Echo Scribe Test"
        }
    }

    // Java/Kotlin 17 is the current Flutter project baseline.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // Enable ViewBinding here if the project adopts it later.
    // buildFeatures { viewBinding true }
}

flutter {
    source = "../.."
}
dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
}
