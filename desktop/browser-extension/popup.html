<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EchoScribe Summary</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <strong>EchoScribe</strong>
      <span id="provider"></span>
    </header>
    <main>
      <button id="summarize" type="button">Summarize</button>
      <select id="summary-language" title="Summary language" aria-label="Summary language">
        <option value="auto">🌐 Auto</option>
        <option value="de">🇩🇪 DE</option>
        <option value="en">🇬🇧 EN</option>
        <option value="es">🇪🇸 ES</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="it">🇮🇹 IT</option>
        <option value="pt">🇵🇹 PT</option>
        <option value="nl">🇳🇱 NL</option>
        <option value="tr">🇹🇷 TR</option>
        <option value="ja">🇯🇵 JA</option>
        <option value="ko">🇰🇷 KO</option>
        <option value="zh">🇨🇳 ZH</option>
      </select>
      <button id="copy" type="button">Copy</button>
      <div id="status"></div>
      <article id="summary"></article>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
