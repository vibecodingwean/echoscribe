# Copy to ~/.config/echoscribe/config.toml or ./config.toml.
# Secrets can stay in the shell environment; OPENAI_API_KEY, GEMINI_API_KEY,
# ANTHROPIC_API_KEY, XAI_API_KEY, and ELEVENLABS_API_KEY are read by default.

[hotkeys]
# The physical Fn key is firmware-dependent. If your laptop does not emit KEY_FN,
# replace these with a visible combination such as "leftctrl+leftalt+a".
dictation_hold = ["fn+a"]

[providers]
# Supported values: "openai", "gemini", "xai", "elevenlabs".
transcription = "openai"
# Supported values: "openai", "gemini", "anthropic", "xai".
summary = "openai"

[summary]
target_language = "de"
app_fetch_url = true
url_summary_prompt = ""
xai_reasoning_effort = "none"

[openai]
api_key = ""
api_key_env = "OPENAI_API_KEY"
transcription_model = "gpt-4o-mini-transcribe"
summary_model = "gpt-5.4-mini"
target_language = "auto"

[gemini]
api_key = ""
api_key_env = "GEMINI_API_KEY"
transcription_model = "gemini-3.1-flash-lite"
summary_model = "gemini-3.1-flash-lite"
target_language = "auto"

[xai]
api_key = ""
api_key_env = "XAI_API_KEY"
transcription_model = "xai-stt"
summary_model = "grok-4.3"
target_language = "auto"
# If true, xAI STT applies inverse text normalization; language should then be set.
stt_format = false

[anthropic]
api_key = ""
api_key_env = "ANTHROPIC_API_KEY"
summary_model = "claude-sonnet-4-6"

[elevenlabs]
api_key = ""
api_key_env = "ELEVENLABS_API_KEY"
transcription_model = "scribe_v2"
target_language = "auto"
# ElevenLabs tags laughter and other audio events by default; dictation keeps raw text.
tag_audio_events = false

[recorder]
# Leave empty for auto: Linux uses ffmpeg pulse input, falling back to arecord.
command = ""
minimum_bytes = 2048
max_seconds = 90

[paste]
# auto prefers Wayland-safe injection first, then X11 tools.
method = "auto"
# auto uses Ctrl+V in normal apps and Ctrl+Shift+V in terminal-like apps.
shortcut = "auto"
paste_delay_ms = 120

[overlay]
icon_path = "assets/floating_dictation.png"
margin_px = 24
top_px = 72
icon_size_px = 58
toast_ms = 1800

