# Copy to ~/.config/echoscribe/config.toml or ./config.toml.
# Secrets can stay in the shell environment; OPENAI_API_KEY, GEMINI_API_KEY,
# XAI_API_KEY, and ELEVENLABS_API_KEY are read by default.

[providers]
# Supported values: "openai", "gemini", "xai", "elevenlabs", "localai".
transcription = "openai"

[openai]
api_key = ""
api_key_env = "OPENAI_API_KEY"
transcription_model = "gpt-4o-mini-transcribe"
target_language = "auto"

[gemini]
api_key = ""
api_key_env = "GEMINI_API_KEY"
transcription_model = "gemini-3.6-flash"
target_language = "auto"

[xai]
api_key = ""
api_key_env = "XAI_API_KEY"
transcription_model = "xai-stt"
target_language = "auto"
# If true, xAI STT applies inverse text normalization; language should then be set.
stt_format = false

[elevenlabs]
api_key = ""
api_key_env = "ELEVENLABS_API_KEY"
transcription_model = "scribe_v2"
target_language = "auto"
# ElevenLabs tags laughter and other audio events by default; dictation keeps raw text.
tag_audio_events = false

[localai]
# OpenAI-compatible Whisper transcription endpoint.
whisper_url = "http://127.0.0.1:8000/v1/audio/transcriptions"
transcription_model = "whisper-1"
target_language = "auto"

[recorder]
# Leave empty for auto: Linux uses ffmpeg pulse input, falling back to arecord.
command = ""
minimum_bytes = 2048
# Show a reminder notification after this many seconds; recording continues.
# Set to 0 to disable the reminder. Provider/API upload limits still apply.
reminder_seconds = 90

[paste]
# auto uses Ctrl+V in normal apps and Ctrl+Shift+V in terminal-like apps.
shortcut = "auto"
paste_delay_ms = 120
